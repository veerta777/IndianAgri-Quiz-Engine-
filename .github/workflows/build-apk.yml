name: Build IndianAgri Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Re-generate Official Android Scaffolding
        working-directory: ./indianagri_mobile
        run: |
          rm -rf android
          flutter create --org com.indianagriexam --project-name indianagri_mobile --platforms=android .
          python3 -c "
          with open('android/app/src/main/AndroidManifest.xml', 'r') as f:
              c = f.read()
          if 'android.permission.INTERNET' not in c:
              c = c.replace('<application', '<uses-permission android:name=\"android.permission.INTERNET\" />\n    <uses-permission android:name=\"android.permission.ACCESS_NETWORK_STATE\" />\n    <application')
              with open('android/app/src/main/AndroidManifest.xml', 'w') as f:
                  f.write(c)
          "

      - name: Fetch Flutter Dependencies
        working-directory: ./indianagri_mobile
        run: flutter pub get

      - name: Build Android Release APK
        working-directory: ./indianagri_mobile
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK as GitHub Artifact
        uses: actions/upload-artifact@v4
        with:
          name: IndianAgriExam-Release-APK
          path: indianagri_mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Prepare APK for Direct Download
        run: cp indianagri_mobile/build/app/outputs/flutter-apk/app-release.apk IndianAgriExam.apk

      - name: Publish Direct APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0
          name: IndianAgriExam Mobile App (Latest)
          body: |
            Official Mobile Application for IndianAgriExam.com.

            ### 📲 Direct Download:
            Tap or click **IndianAgriExam.apk** below to download directly to your phone.
          files: IndianAgriExam.apk
