name: Build IndianAgri Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  build-apk:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Fetch Flutter Dependencies
        working-directory: ./indianagri_mobile
        run: flutter pub get

      - name: Build Android Release APK
        working-directory: ./indianagri_mobile
        run: flutter build apk --release

      - name: Upload APK as GitHub Artifact
        uses: actions/upload-artifact@v4
        with:
          name: IndianAgriExam-Release-APK
          path: indianagri_mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
